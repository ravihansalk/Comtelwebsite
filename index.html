function useOnScreen(ref) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setVisible(true);
          obs.disconnect();
        }
      },
      { threshold: 0.2 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [ref]);
  return visible;
}

function Reveal({ children, className = "" }) {
  const ref = useRef(null);
  const visible = useOnScreen(ref);
  return (
    <div ref={ref} className={`cmt-reveal ${visible ? "is-visible" : ""} ${className}`}>
      {children}
    </div>
  );
}

}
.cmt-quote {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 36px;
  position: relative;
  box-shadow: 0 4px 18px rgba(11,18,32,0.05);
}
.cmt-quote p {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px;
  line-height: 1.4;
  margin: 0 0 18px;
}
.cmt-quote__cite { color: var(--accent); font-size: 14px; font-weight: 600; }

/* PARTNERS */
.cmt-partners { padding: 72px 0; text-align: center; background: var(--bg-alt); }
.cmt-brands__row {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 14px;
  margin-top: 28px;
}
.cmt-brands__card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  box-shadow: 0 4px 18px rgba(11,18,32,0.05);
}
.cmt-brands__logo {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

/* CONTACT */
.cmt-contact { padding: 96px 0; }
.cmt-contact__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
.cmt-contact__cards { display: flex; flex-direction: column; gap: 14px; }
.cmt-contact__card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 22px;
  color: var(--ink);
  text-decoration: none;
  font-size: 15px;
  box-shadow: 0 4px 18px rgba(11,18,32,0.05);
}
.cmt-contact__card:hover { border-color: var(--accent); }

/* FOOTER */
.cmt-footer {
  background: linear-gradient(180deg, #3E6FCB 0%, #3564bd 45%, #2c56a8 100%);
  padding: 64px 0 0;
}
.cmt-footer__top {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1.2fr;
  gap: 40px;
  padding-bottom: 44px;
}
.cmt-footer__brand { display: flex; flex-direction: column; gap: 14px; }
.cmt-footer__blurb {
  color: rgba(234,242,255,.78);
  font-size: 14px;
  line-height: 1.6;
  max-width: 34ch;
  margin: 0;
}
.cmt-footer__heading {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #fff;
  margin: 0 0 18px;
}
.cmt-footer__links { display: flex; flex-direction: column; gap: 12px; }
.cmt-footer__links a, .cmt-footer__links span { color: rgba(234,242,255,.78); text-decoration: none; font-size: 14.5px; }
.cmt-footer__links a:hover { color: #5FD6F5; }
.cmt-logo--footer .cmt-logo__word { color: #fff; }
.cmt-logo--footer .cmt-logo__tagline { color: rgba(234,242,255,.65); }
.cmt-footer__bottom {
  border-top: 1px solid rgba(255,255,255,.15);
  padding: 22px 0;
}
.cmt-footer__copy { color: rgba(234,242,255,.65); font-size: 13px; margin: 0; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .cmt-hero__grid, .cmt-work__grid, .cmt-contact__grid { grid-template-columns: 1fr; }
  .cmt-why__grid, .cmt-services__grid { grid-template-columns: 1fr 1fr; }
  .cmt-brands__row { grid-template-columns: repeat(4, 1fr); }
  .cmt-footer__top { grid-template-columns: 1fr 1fr; }
  .cmt-nav__links, .cmt-nav__actions { display: none; }
  .cmt-nav__burger { display: flex; }
}
@media (max-width: 600px) {
  .cmt-why__grid, .cmt-services__grid { grid-template-columns: 1fr; }
  .cmt-brands__row { grid-template-columns: repeat(3, 1fr); }
  .cmt-footer__top { grid-template-columns: 1fr; }
  .cmt-hero { padding-top: 72px; }
}

@media (prefers-reduced-motion: reduce) {
  .cmt-signal__dot, .cmt-marquee__track { animation: none; }
  .cmt-reveal { transition: none; }
}
`;

ReactDOM.createRoot(document.getElementById('root')).render(<ComtelSite />);
</script>
</body>
</html>
